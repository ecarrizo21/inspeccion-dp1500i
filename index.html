dor de hidráulico/soporte/fisuras"], [7, "Estado del porta filtro de aceite hidráulico/soporte/anclajes"], [8, "Chequeo motor hidráulico/ventilador/anclajes"], [9, "Mangueras/protectores"]]], ["9. SISTEMA ELECTRICO", [[2, "Arranque/bulones/alarma arranque pegado"], [3, "Alarma de retroceso/anclajes"], [4, "Alternador/arranque/anclajes"], [5, "Máster Switch/Baterías/bornes"], [7, "Tablero principal ESG/MP"], [8, "Cableado general"]]], ["10. SISTEMA DE CONTROL", [[1, "SDP Sensor posición martillo perforador"], [2, "DM Componente control de perforación"], [3, "DC Controlador de perforación"], [4, "RHC Controlador manipulación de varillas"], [5, "HM HMI maestro"], [6, "SAU Unidad apunte del sensor"], [7, "RAR Reposabrazos derecho"], [8, "LAR Reposabrazos izquierdo"], [9, "SM Maestro del sistema"], [10, "PPC Controlador de la unidad de alimentación"], [11, "FCC Controlador portador delantero"], [12, "RCC Controlador portador trasero"], [13, "PPS Unidad de alimentación esclava"], [14, "ECM Módulo control de motor"], [15, "WIC Controlador de inyección de agua"], [16, "SCI Sensor inclinación del portador"], [17, "SBA Sensor de oscilación brazo"]]], ["11. SISTEMA NEUMATICO", [[1, "Compresor/sensor/fugas/bulones anclaje"], [2, "Tacho de aceite compresor/mirilla/nivel"], [3, "Porta filtro aceite/sensor de saturación/soporte"], [4, "Válvula de admisión del compresor/válvula del tacho"], [5, "Banco neumático/válvulas/manómetro/bulones"], [6, "Filtro de aire/porta filtro"], [7, "Radiador/soporte/ventilador/termostato"], [8, "Mangueras/protectores"]]], ["11. SISTEMA CAPTADOR DE POLVO", [[1, "Colectora de polvo/Clapeta/filtros/caños"], [2, "Motor hidráulico colectora/mangueras/válvulas"], [3, "Ciclón primario/cono/soporte/bulones"], [4, "Manguera de aspiración 1ria/2ria/abrazadera"], [5, "Gomas de cierre/copa succión/soporte"], [6, "Mangueras/protectores"]]], ["12. UNIDAD LUBRICACION MARTILLO", [[1, "Depósito de aceite nuevo/usado/nivel"], [2, "SLU/cableado/sensores"], [3, "Separador de agua/presostato"], [4, "Mangueras/protectores"]]], ["13. GRUPO DE TRANSFERENCIA", [[1, "Caja de transferencia/nivel/varilla/respiradero/bulones"]]], ["14. DEPOSITOS", [[1, "Depósito de hidráulico/bulones/nivel/golpes/respiradero"], [2, "Depósito de combustible/bulones/golpes/nivel/respiradero"]]], ["15. OTROS", [[1, "Portones/amortiguadores"], [2, "Estado acople carga y descarga rápida"], [3, "Sistema de inyección de agua"], [4, "Sistema de engrase automático/barras"], [5, "Estado de bomba manual/acoples rápidos"], [6, "Grupo gato hidráulico trasero/manguera/protectores"]]], ["16. TREN RODANTE", [[1, "Cilindro de oscilación/pernos/engrase"], [2, "Banco oscilación/soporte/mangueras"], [3, "Banco traslación/soporte/mangueras"], [4, "Mandos finales/motor hidráulico/fuga/bulones"], [5, "Bastidor derecho/izquierdo/fisuras"], [6, "Rueda cavilla/trineo/rueda guía/izquierdo/derecho"], [7, "Cadena/rolos/zapatas/izquierda/derecha/fisuras"]]]]</script>
<style>
#dp920 button{margin:6px 0 0;background:#282828;color:#eee;border:1px solid #555;padding:10px;border-radius:6px;font:inherit}#dp920 summary{display:flex;align-items:center;justify-content:space-between;gap:8px}#dp920 output{flex-shrink:0}#dp920 fieldset{min-width:0}#dp920 .work+.work{border-top:1px solid #555;padding-top:12px}#dp920 summary:before{content:'▸'}#dp920 details[open]>summary:before{content:'▾'}#dp920 summary span{flex:1}
</style><script>
const catalog=JSON.parse(document.getElementById('catalog').textContent);
const base=location.pathname.replace(/index\.html$/,'');
const storageKey='dp1500i-completa-v2:'+base;
const saved=document.getElementById('saved');
let draft={};
let legacy={};
try {
  draft=JSON.parse(localStorage.getItem(storageKey)||'{}');
  if(!Object.keys(draft).length) legacy=JSON.parse(localStorage.getItem('inspeccion-general-v1:'+base)||'{}');
  if(Object.keys(draft).length||Object.keys(legacy).length) saved.textContent='Borrador recuperado';
} catch {saved.textContent='No se pudo leer el borrador';}
function persist(){
  try {localStorage.setItem(storageKey,JSON.stringify(draft));saved.textContent='Guardado en este dispositivo';}
  catch {saved.textContent='Error al guardar en este dispositivo';}
}
function element(tag,parent,text){
 const node=document.createElement(tag);parent.append(node);
 if(text!==undefined) node.textContent=text;return node;
}
function field(parent,title,type,key,priorKey){
 const label=element('label',parent,title);
 const control=element(type==='select'?'select':'input',label);
 if(type==='select'){
  for(const [v,t] of [['','Pendiente'],['0','0 · Normal'],['1','1 · Generar aviso'],['2','2 · Intervenir equipo'],['3','3 · Parar equipo']]) control.add(new Option(t,v));
 }else control.type=type;
 control.dataset.key=key;
 control.value=draft[key]??legacy[priorKey]??'';
 if(control.value!=='') draft[key]=control.value;
 return control;
}
for(const [title,type] of [['Fecha','date'],['Equipo','number'],['Orden','number'],['Fecha últ. insp.','date'],['Hs. inicio','time'],['Hs. entrega','time'],['Hs. motor','number'],['Hs. percusión','number'],['Inspector','text'],['Operador','text']]){
 const key='Cabecera/'+title;field(document.getElementById('header'),title,type,key,key);
}
const note=document.querySelector('textarea');note.value=draft[note.dataset.key]??legacy[note.dataset.key]??'';draft[note.dataset.key]=note.value;
function recount(section){
 const count=[...section.querySelectorAll('fieldset')].filter(item=>[...item.querySelectorAll('[data-current]')].some(c=>Number(c.value)>0)).length;
 section.querySelector('output').textContent=count?count+' con novedad':'';
}
for(const [section,items] of catalog){
 const details=element('details',document.getElementById('systems'));
 const summary=element('summary',details);element('span',summary,section);element('output',summary).setAttribute('aria-live','polite');
 for(const [num,name] of items){
  const box=element('fieldset',details);const title=num+'. '+name; element('legend',box,title);
  const works=element('div',box);const key=section+'/'+num;
  function addWork(i){
   const work=element('div',works);work.className='work';const grid=element('div',work);grid.className='grid';
   for(const [label,type] of [['Ant.','select'],['Act.','select'],['Descripción','text'],['Orden','text']]){
    const oldKey=section==='1. GENERAL'&&i===0?title+'/'+label:null;
    const input=field(type==='select'?grid:work,label,type,key+'/'+i+'/'+label,oldKey);
    if(label==='Act.')input.dataset.current='true';
   }
  }
  const rows=Number(draft[key+'/rows'])||1;for(let i=0;i<rows;i++)addWork(i);
  const button=element('button',box,'+ Otro trabajo');button.type='button';
  button.onclick=()=>{const i=works.children.length;addWork(i);draft[key+'/rows']=i+1;persist();};
 }
 recount(details);
}
function onEdit(event){
 const control=event.target;if(!control.dataset.key)return;
 draft[control.dataset.key]=control.value;
 if(control.dataset.current)recount(control.closest('details'));
 persist();
}
document.addEventListener('input',onEdit);document.addEventListener('change',onEdit);
(async()=>{
 const status=document.getElementById('offline');
 try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;status.textContent='Lista para usar sin conexión';}
 catch {status.textContent='Uso sin conexión pendiente';}
})();
</script></body></html>
