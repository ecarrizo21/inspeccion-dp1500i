#dp920{background:#161616;color:#eee;font:15px/1.45 system-ui;padding:18px;border-radius:12px;color-scheme:dark}#dp920 main{max-width:570px;margin:auto}#dp920 h2{font:600 20px system-ui;margin:0 0 14px}#dp920 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}#dp920 label{display:block;color:#c7c5bf}#dp920 input,#dp920 select,#dp920 textarea{display:block;width:100%;min-width:0;box-sizing:border-box;background:#202020;color:#fafafa;border:1px solid #454545;border-radius:6px;padding:8px;font:inherit;min-height:44px}#dp920 details,#dp920 .system{background:#202020;border:1px solid #393939;margin:6px 0;border-radius:8px}#dp920 summary,#dp920 .system{padding:12px}#dp920 .system{color:#aaa}#dp920 summary{cursor:pointer}#dp920 fieldset{margin:12px;border:1px solid #454545;border-radius:6px}#dp920 fieldset label{margin-bottom:6px}#dp920 output{float:right;color:#ffbc44}#dp920 p{color:#c7c5bf}
</style><main><h2>Inspección DP1500i</h2><small id="offline" role="status">Preparando uso sin conexión…</small> · <small id="saved" role="status">Borrador de prueba</small><div class="grid" data-head></div><p>Criticidad: 0 normal · 1 generar aviso · 2 intervenir equipo · 3 parar equipo</p><details><summary>1. GENERAL <output aria-live="polite"></output></summary><div data-items></div></details><div data-systems></div><label>Novedades<textarea></textarea></label></main></div>
<script>
(()=>{
const root=document.getElementById('dp920');
function field(parent,title,type,value){const label=document.createElement('label');label.textContent=title;const input=document.createElement(type==='select'?'select':'input');if(type==='select'){for(const n of ['','0','1','2','3'])input.add(new Option(n||'Pendiente',n));}else input.type=type;input.value=value;label.append(input);parent.append(label);return input;}
for(const [name,type,value] of [['Fecha','date','2026-10-26'],['Equipo','number','920'],['Orden','number',''],['Fecha últ. insp.','date','2026-10-14'],['Hs. inicio','time','12:00'],['Hs. entrega','time','13:00'],['Hs. motor','number','5281'],['Hs. percusión','number','5367'],['Inspector','text',''],['Operador','text','']])field(root.querySelector('[data-head]'),name,type,value);
const currents=[];
for(const [i,name] of ['Novedades del operador','Estado de las insignias (Ley Minera, n° interno)','Sistema ANSUL/disparador/precinto/matafuego'].entries()){const item=document.createElement('fieldset'),title=document.createElement('legend');title.textContent=(i+1)+'. '+name;item.append(title);root.querySelector('[data-items]').append(item);const grid=document.createElement('div');grid.className='grid';item.append(grid);field(grid,'Ant.','select','0');const act=field(grid,'Act.','select','0');currents.push(act);act.onchange=()=>{const n=currents.filter(input=>Number(input.value)>0).length;root.querySelector('output').textContent=n?n+' con novedad':'';};field(item,'Descripción','text','');field(item,'Orden','text','');}
for(const s of ['2. CABINA','3. MARTILLO','4. MESA DE AVANCE','5. CAMBIADOR DE BARRAS','6. BOOM','7. MOTOR','8. HIDRAULICOS DE PERFORACION','9. SISTEMA ELECTRICO','10. SISTEMA DE CONTROL','11. SISTEMA NEUMATICO','11. SISTEMA CAPTADOR DE POLVO','12. UNIDAD LUBRICACION MARTILLO','13. GRUPO DE TRANSFERENCIA','14. DEPOSITOS','15. OTROS','16. TREN RODANTE']){const row=document.createElement('div');row.className='system';row.textContent=s;root.querySelector('[data-systems]').append(row);}
})();
</script>
